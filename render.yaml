services:
  - type: web
    name: pofi-relay
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: node relay.cjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: POFI_RELAY_KEY
        generateValue: true
