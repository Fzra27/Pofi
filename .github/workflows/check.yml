name: Check and package Pofi
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools zstd xvfb x11-utils xauth dbus-x11
      - run: npm ci
      - run: npm test
      - run: npm run build:all
      - name: Smoke test AppImage without requiring FUSE
        run: bash scripts/smoke-appimage.sh dist/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: pofi-linux-x86_64
          path: |
            dist/*.deb
            dist/*.pkg.tar.zst
            dist/*.AppImage
